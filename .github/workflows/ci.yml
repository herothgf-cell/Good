name: Verify Praise Star
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: praise-star-app-and-test-results
          path: |
            dist/
            preview.html
            artifacts/
          retention-days: 7
  database:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praise_star_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
      - run: python tests/db_test.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/praise_star_test
          ALLOW_TEST_DATABASE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: praise-star-database-results
          path: artifacts/db-results.json
          retention-days: 7
