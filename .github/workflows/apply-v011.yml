name: Verify and apply v0.11 source
on:
  push:
    branches: [work/praise-chat-v011-20261102]
    paths: [.github/workflows/apply-v011.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify transfer and materialize reviewed source
        shell: bash
        run: |
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          base='f4a50cc49df285e093c65ca8fdd201a0cca3c218'
          paths='''.env.example
          .gitignore
          README.md
          docs/CURRENT_STATUS.md
          docs/references/PHONICS_15MIN.md
          docs/references/phonics-15min-source.json
          docs/superpowers/plans/2026-11-02-integrated-english.md
          docs/superpowers/plans/2026-11-02-praise-management.md
          docs/superpowers/specs/2026-11-02-integrated-english.md
          docs/superpowers/specs/2026-11-02-praise-management-design.md
          docs/technical/LEARNING_INTEGRATED_ENGLISH.md
          docs/technical/PRAISE_V011.md
          docs/verification/INTEGRATED_ENGLISH_REVIEW.md
          docs/verification/PRAISE_V011_REVIEW.md
          package-lock.json
          package.json
          public/sw.js
          src/auth.ts
          src/experience.css
          src/experience.ts
          src/learning-audio.ts
          src/learning-coach.ts
          src/learning-lab.css
          src/learning-lab.ts
          src/learning-reader.ts
          src/learning-writing.ts
          src/main.ts
          src/praise-date.ts
          src/ui.ts
          supabase/functions/_server/coach.d.ts
          supabase/functions/_server/coach.js
          supabase/functions/_server/narration.d.ts
          supabase/functions/_server/narration.js
          supabase/functions/_shared/domain.ts
          supabase/functions/_shared/learning-lab-content.ts
          supabase/functions/_shared/learning-lab.ts
          supabase/functions/_shared/phonics-curriculum.ts
          supabase/functions/learning-coach/index.ts
          tests/experience_browser_test.py
          tests/learning-audio.test.mjs
          tests/learning-coach-auth.test.mjs
          tests/learning-coach-client.test.mjs
          tests/learning-coach-entrypoint.test.mjs
          tests/learning-integration.test.mjs
          tests/learning-lab-content.test.mjs
          tests/learning-lab-ui.test.mjs
          tests/learning-narration.test.mjs
          tests/learning-realtime-ui.test.mjs
          tests/learning_coach_browser_test.py
          tests/learning_integrated_browser_test.py
          tests/learning_lab_browser_test.py
          tests/phonics-curriculum.test.mjs
          tests/phonics-domain.test.mjs
          tests/praise-management-domain.test.mjs
          tests/praise-management-ui.test.mjs
          tests/praise_management_browser_test.py
          tests/shell-version.test.mjs'''.splitlines()
          assert len(paths)==57 and len(set(paths))==57
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert all(p.startswith('.delivery/v011-') or p=='.github/workflows/apply-v011.yml' for p in changed), changed
          digest=lambda b:hashlib.sha256(b).hexdigest()
          baseline={}
          for p in paths:
              r=subprocess.run(['git','show',base+':'+p],capture_output=True)
              baseline[p]=r.stdout.decode('utf-8') if r.returncode==0 else ''
          raw=json.dumps(baseline,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
          assert digest(raw)=='aa3bd559a57cfcaf6aac42d5f0e93ebe26bb0c2727724a38ed674ad0b19acd12', digest(raw)
          pathlib.Path('/tmp/v011-base.json').write_bytes(raw)
          expected=['8fbd10849f24ddb0b7f9d1001a75dbe8022bd53479952167c46e926b66747a0e','59d4f14269cfd8337e8deb4baebdb2ae4f1e9ce001761a214edaf8b3e914cfbb','6975907a03313891d95eeb521bb90a178ffc0d3ca50bbac8865ed827fdd87b80','aa9946677211b07aab65ead109f26c7a6782f979d25b512be8fe913e044f7997']
          chunks=[]
          for i,want in enumerate(expected):
              part=pathlib.Path(f'.delivery/v011-{i}.b64').read_bytes()
              assert digest(part)==want, (i,len(part),digest(part))
              chunks.append(part)
          pathlib.Path('/tmp/v011.zst').write_bytes(base64.b64decode(b''.join(chunks),validate=True))
          subprocess.run(['zstd','-d','--patch-from=/tmp/v011-base.json','/tmp/v011.zst','-o','/tmp/v011-source.json'],check=True)
          data=pathlib.Path('/tmp/v011-source.json').read_bytes()
          assert digest(data)=='ab8dd8227cf1a2bbaf8ee80006a1bbb52424258857d0af9d0efc020db51f274d',digest(data)
          payload=json.loads(data)
          assert set(payload)==set(paths)
          manifest=[]
          for p in paths:
              assert not pathlib.PurePosixPath(p).is_absolute() and '..' not in pathlib.PurePosixPath(p).parts
              content=payload[p].encode('utf-8')
              target=pathlib.Path(p);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(content)
              manifest.append(digest(content)+'  '+p)
          pathlib.Path('/tmp/v011-sha256.txt').write_text('\n'.join(manifest)+'\n')
          for i in range(4):pathlib.Path(f'.delivery/v011-{i}.b64').unlink()
          pathlib.Path('.github/workflows/apply-v011.yml').unlink()
          print('Verified 57 files against reviewed local source SHA-256.')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified source on feature branch only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: unified English and dated praise inbox v0.11'
          git push origin HEAD:work/praise-chat-v011-20261102
          git rev-parse HEAD | tee /tmp/v011-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v011-source-verification
          path: |
            /tmp/v011-sha256.txt
            /tmp/v011-commit.txt
          retention-days: 7
