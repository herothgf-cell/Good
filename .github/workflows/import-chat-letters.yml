name: Import verified chat and letters source
on:
  push:
    branches: [work/chat-letters-20261102]
    paths: [.release-transfer/chat-v11.3.b64]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/chat-letters-20261102
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply hash-verified source bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,struct,subprocess
          from pathlib import Path
          root=Path.cwd()
          parts=[Path(f'.release-transfer/chat-v11.{i}.b64') for i in range(1,4)]
          compressed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='84e331ec010d5dabd70e846005ef0193913f34cb9d1c15d277b5f6ece8b284d7', 'Transfer checksum mismatch'
          raw=lzma.decompress(compressed);length=struct.unpack('>I',raw[:4])[0]
          spec=json.loads(raw[4:4+length]);literals=raw[4+length:]
          assert spec['base_tree']=='0561350b0517cb149f44d08e444255e43b8445ec'
          assert spec['target_tree']=='30251296c7caa058f74ff1180875cae55f9d4b67'
          for f in spec['files']:
              path=Path(f['p'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert str(path) not in ['.env','public/config.js'] and path.suffix.lower()!='.pdf'
              old=b'' if f['a'] else path.read_bytes()
              assert hashlib.sha256(old).hexdigest()==f['old'], f'Old file changed: {path}'
              chunks=[]
              for op in f['ops']:
                  assert len(op) in (2,3) and all(isinstance(x,int) and x>=0 for x in op)
                  source=literals if len(op)==3 and op[2]==1 else old
                  assert op[0]+op[1]<=len(source)
                  chunks.append(source[op[0]:op[0]+op[1]])
              new=b''.join(chunks)
              assert hashlib.sha256(new).hexdigest()==f['new'], f'New file mismatch: {path}'
              if f['d']:
                  subprocess.run(['git','rm','--',str(path)],check=True)
              else:
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(new)
                  subprocess.run(['git','add','--',str(path)],check=True)
          subprocess.run(['git','rm','--',*map(str,parts),'.github/workflows/import-chat-letters.yml'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==spec['target_tree'], f'Entire source tree mismatch: {tree}'
          print(f'Verified {len(spec["files"])} files and exact source tree {tree}')
          PY
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Commit verified source only
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: unified audio-text chat, ordered behaviors and dated praise inbox v0.11'
          git push origin HEAD:work/chat-letters-20261102
          echo "Verified source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
