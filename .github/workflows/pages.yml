name: Deploy family web app to Pages
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'cloud requires Supabase public repository variables; demo stores data only in each browser'
        type: choice
        options: [demo, cloud]
        default: demo
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Build selected deployment mode
        run: npm run build
        env:
          SUPABASE_URL: ${{ inputs.mode == 'cloud' && vars.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ inputs.mode == 'cloud' && vars.SUPABASE_PUBLISHABLE_KEY || '' }}
          SUPABASE_ANON_KEY: ${{ inputs.mode == 'cloud' && vars.SUPABASE_ANON_KEY || '' }}
          REQUIRE_CLOUD_CONFIG: ${{ inputs.mode == 'cloud' && '1' || '0' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
