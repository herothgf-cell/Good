name: Verify unified English source transfer
on:
  push:
    branches: [work/unified-english-20261102]
    paths: [.github/workflows/unified-english-workspace.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Retrieve only the verified proposed source (temporary scoped URL)
        env:
          SOURCE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-6514-8206-9d89-9488434bebe4/raw?se=2026-11-02T10%3A04%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=5b784f32-f8f4-50fd-88b5-7a0aa8d4fdf0&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T00%3A26%3A39Z&ske=2026-11-03T00%3A26%3A39Z&sks=b&skv=2026-02-06&sig=en0IsiRtigSXFp05e5KfjWkNY0ux4cnRMK/1LyCSvGo%3D'
        run: |
          test "$(git rev-parse HEAD^)" = 'f4a50cc49df285e093c65ca8fdd201a0cca3c218'
          curl --fail --silent --show-error --max-time 40 --retry 2 "$SOURCE_URL" -o /tmp/unified-transfer.json
          python - <<'PY'
          import hashlib,json,pathlib
          raw=pathlib.Path('/tmp/unified-transfer.json').read_bytes()
          assert len(raw)==109701
          assert hashlib.sha256(raw).hexdigest()=='90bf98c3dc38b8765ae4d7e2b8cc63dd0d2b1bff3f572118c026a19e9ff2a3fd'
          changes=json.loads(raw);assert len(changes)==33
          pending=[]
          for change in changes:
              path=pathlib.PurePosixPath(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('src/','supabase/','tests/','docs/','scripts/')) or str(path) in ('package.json','package-lock.json')
              target=pathlib.Path(path)
              old=target.read_text() if target.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'],str(path)
              new=old
              for start,end,text in reversed(change['edits']):
                  assert 0<=start<=end<=len(old)
                  new=new[:start]+text+new[end:]
              assert hashlib.sha256(new.encode()).hexdigest()==change['after'],str(path)
              pending.append((target,new))
          for target,new in pending:
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(new)
          PY
          git rm .github/workflows/unified-english-workspace.yml
          git add src supabase tests docs scripts package.json package-lock.json
          test "$(git write-tree)" = '69210185a81b01b1130fd0a4e7d159c70938a293'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Commit verified source on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: unify English voice-text chat and source-based phonics course'
          git push origin HEAD:refs/heads/work/unified-english-20261102
